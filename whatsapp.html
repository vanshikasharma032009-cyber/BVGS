<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087443">
  <title>Welcome | Bal Vikas Global School</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf7ef,#f7fbf8);font-family:Arial,Helvetica,sans-serif;color:#18352a}
    .welcome-card{width:min(100%,560px);background:#fff;border:1px solid #dcebe1;border-radius:24px;padding:42px 28px;text-align:center;box-shadow:0 18px 55px rgba(12,75,45,.12)}
    .school-mark{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#e7f6ed;color:#087443;font-size:34px;font-weight:700}
    .eyebrow{margin:0 0 10px;color:#087443;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    h1{margin:0;color:#075b37;font-size:clamp(27px,6vw,38px);line-height:1.18}
    .intro{margin:16px auto 26px;max-width:420px;color:#5b6b62;font-size:16px;line-height:1.65}
    .contact-label{margin:0 0 8px;color:#64746a;font-size:14px}
    .phone{margin:0 0 24px;color:#18352a;font-size:22px;font-weight:700;letter-spacing:.3px}
    .chat-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:min(100%,330px);min-height:52px;padding:14px 22px;border-radius:999px;background:#08c66a;color:#063c24;text-decoration:none;font-size:16px;font-weight:700;border:1px solid #079b55;transition:transform .2s,background .2s}
    .chat-button:hover{background:#05b95f;transform:translateY(-1px)}
    .note{margin:20px 0 0;color:#78877e;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
  <main class="welcome-card">
    <div class="school-mark" aria-hidden="true">BV</div>
    <p class="eyebrow">Bal Vikas Global School</p>
    <h1>Welcome to Bal Vikas Global School</h1>
    <p class="intro">Thank you for connecting with us. Our school team will be happy to assist you with your queries.</p>
    <p class="contact-label">Chat with us on WhatsApp</p>
    <p class="phone">+91 93107 26000</p>
    <a class="chat-button" href="https://wa.me/919310726000" target="_blank" rel="noopener noreferrer" aria-label="Continue to WhatsApp">Continue to WhatsApp <span aria-hidden="true">→</span></a>
    <p class="note">Bal Vikas Global School · Kaithal, Haryana</p>
  </main>
</body>
</html>
